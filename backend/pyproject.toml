[project]
name = "prompilot"
version = "0.1.0"
description = "Chat-driven Prometheus visualization with Grafana export"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=3.14.1",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Prose for the model: prompt text and tool descriptions read better unwrapped.
"app/agent/prompts.py" = ["E501"]
"app/agent/tools.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a live Prometheus (set PROMPILOT_TEST_PROMETHEUS_URL)"]
