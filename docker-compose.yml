# Demo stack: PromPilot + Prometheus + node-exporter.
#
#   docker compose up -d               → app on http://localhost:8080
#   docker compose --profile grafana up -d   → also Grafana on http://localhost:3000 (admin/admin)
#   docker compose --profile ollama up -d    → also a local Ollama LLM on http://localhost:11434
#
# Configure the LLM via a .env file (see .env.example).

services:
  prompilot:
    build: .
    image: prompilot:local
    ports:
      - "8080:8080"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_TLS_VERIFY: ${PROMETHEUS_TLS_VERIFY:-true}
      PROMETHEUS_CA_FILE: ${PROMETHEUS_CA_FILE:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_USE_VERTEX: ${GEMINI_USE_VERTEX:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_API_TOKEN: ${AUTH_API_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-browser}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-browser}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - prompilot-data:/data
      # Markdown notes about your system, read by the chat agent (see docs/knowledge.md).
      - ./knowledge:/data/knowledge:ro
    depends_on:
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Demo metrics source. Kept portable (no host mounts) so the stack starts
  # unchanged on Linux, macOS and Windows; on Linux you may add
  # `pid: host` and `- /:/host:ro,rslave` to export real host metrics.
  node-exporter:
    image: prom/node-exporter:v1.9.1

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["grafana"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  prompilot-data:
  prometheus-data:
  grafana-data:
  ollama-data:
