global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # PromPilot's own metrics: HTTP, agent turns and tool calls, catalog builds.
  - job_name: prompilot
    static_configs:
      - targets: ["prompilot:8080"]
